name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test vaultbar.slnx -c Release

      - name: End to end
        run: tests/e2e-macos/run.sh

      - name: Installer
        shell: pwsh
        run: |
          ./build.ps1 -Runtime osx-arm64 -Version 0.0.0
          tests/install-test-macos.sh dist/vaultbar-osx-arm64.tar.gz

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test vaultbar.slnx -c Release

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          ./build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: vaultbar
          path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
