name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test vaultbar.slnx -c Release -p:RestoreLockedMode=true --blame-hang-timeout 10m

      # Opens Safari, Chrome and Edge on the throwaway runner; a step of its own, so a stuck browser cannot hide the rest.
      - name: Browser addresses
        timeout-minutes: 12
        env:
          VAULTBAR_BROWSER_TESTS: '1'
        run: dotnet test tests/Vaultbar.Tests -c Release -p:RestoreLockedMode=true --no-build --filter "FullyQualifiedName~BrowserAddressTests" --blame-hang-timeout 4m --logger "console;verbosity=normal"

      - name: End to end
        env:
          E2E_OUT: ${{ runner.temp }}/screens-macos
        run: tests/e2e-macos/run.sh

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          ./build.ps1 -Runtime osx-arm64,osx-x64 -Version $version

      # Only a release gets the signing secrets; every other run proves the packaging with an ad-hoc signature.
      - name: Package
        env:
          APPLE_CERTIFICATE_P12: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.ref_type == 'tag' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_APP_PASSWORD || '' }}
        run: packaging/macos/package.sh dist osx-arm64 osx-x64

      - name: Disk image
        run: tests/dmg-test-macos.sh dist/vaultbar-osx-arm64.dmg

      - name: Installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/install-test-macos.sh dist/vaultbar-osx-arm64.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaultbar-macos
          path: |
            dist/*.tar.gz
            dist/*.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens-macos
          path: ${{ runner.temp }}/screens-macos
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test vaultbar.slnx -c Release -p:RestoreLockedMode=true --blame-hang-timeout 10m

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          ./build.ps1 -Runtime linux-x64,linux-arm64 -Version $version

      - name: Linux end to end
        shell: pwsh
        run: tests/e2e-linux/run.ps1 -DockerContext ''

      - name: Linux installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm -e GITHUB_TOKEN -v "$PWD:/w" "$(cat tests/linux-image)" bash /w/tests/install-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaultbar-linux
          path: dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screens-linux
          path: dist/e2e
          if-no-files-found: ignore

  # Windows builds here, not on Linux, because Authenticode signing needs a Windows runner.
  windows:
    runs-on: windows-latest
    # Only a release tag, and only once signing is set up (VBR-8), enters the environment Azure's federated credential trusts.
    environment: ${{ github.ref_type == 'tag' && vars.SIGNING_ENABLED == 'true' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The runner image has Edge, Chrome and Firefox and is thrown away afterwards, so the address tests open them.
      - name: Test
        env:
          VAULTBAR_BROWSER_TESTS: '1'
        run: dotnet test vaultbar.slnx -c Release -p:RestoreLockedMode=true --blame-hang-timeout 10m

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          ./build.ps1 -Runtime win-x64,win-arm64 -Version $version

      # Azure Artifact Signing through OIDC: no secret exists. Off until SIGNING_ENABLED is true; then a failure stops the
      # release instead of shipping an unsigned exe.
      - name: Log in to Azure for signing
        if: github.ref_type == 'tag' && vars.SIGNING_ENABLED == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign
        if: github.ref_type == 'tag' && vars.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\win-x64\vaultbar.exe
            ${{ github.workspace }}\dist\win-arm64\vaultbar.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: pwsh
        env:
          SIGNED: ${{ github.ref_type == 'tag' && vars.SIGNING_ENABLED == 'true' }}
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            $exe = "dist/$rid/vaultbar.exe"
            if ($env:SIGNED -eq 'true' -and (Get-AuthenticodeSignature $exe).Status -ne 'Valid') { throw "$exe is not validly signed" }
            # build.ps1 zipped the exe before signing; zip the one that ships.
            Compress-Archive -Path $exe -DestinationPath "dist/vaultbar-$rid.zip" -Force
          }

      - name: Installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tests/install-test-windows.ps1 dist/vaultbar-win-x64.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaultbar-windows
          path: dist/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: [macos, build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vaultbar-*
          path: dist
          merge-multiple: true

      # Build provenance, verifiable with `gh attestation verify <file> --repo byhofman/vaultbar`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/*.dmg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
