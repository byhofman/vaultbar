name: Runtime check

# Releases bundle the .NET runtime, so a .NET security patch only reaches users through a new Vaultbar release (L6).
# This fails when Microsoft has shipped a security release of the runtime after the latest Vaultbar release.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the latest .NET security release with the latest Vaultbar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=$(jq -r '.sdk.version' global.json | cut -d. -f1,2)
          releases=$(curl -fsSL "https://builds.dotnet.microsoft.com/dotnet/release-metadata/$channel/releases.json")
          security=$(jq -r '[.releases[] | select(.security == true)][0] | "\(."release-version") \(."release-date")"' <<< "$releases")
          read -r runtime runtime_date <<< "$security"
          shipped=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt --jq '"\(.tagName) \(.publishedAt[0:10])"')
          read -r tag shipped_date <<< "$shipped"
          echo ".NET $runtime security release: $runtime_date; Vaultbar $tag: $shipped_date"
          if [[ "$runtime_date" > "$shipped_date" ]]; then
            echo "::error::.NET $runtime ($runtime_date) fixes security issues and is newer than Vaultbar $tag ($shipped_date). Cut a release so users get the patched runtime."
            exit 1
          fi
